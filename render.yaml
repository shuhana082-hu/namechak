services:
  - type: web
    name: ff-name-check-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: UPSTREAM_URL
        sync: false
      - key: UPSTREAM_KEY
        sync: false
      - key: API_KEYS
        sync: false
      - key: DEFAULT_REGION
        value: BD
      - key: CACHE_TTL_SECONDS
        value: "300"
      - key: RATE_LIMIT_PER_MIN
        value: "60"
