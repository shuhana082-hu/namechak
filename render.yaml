services:
  - type: web
    name: ff-name-check-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: FF_API_KEY
        sync: false
      - key: API_KEYS
        sync: false
      - key: DEFAULT_REGION
        value: BD
      - key: CACHE_TTL_SECONDS
        value: "1800"
      - key: RATE_LIMIT_PER_MIN
        value: "60"
